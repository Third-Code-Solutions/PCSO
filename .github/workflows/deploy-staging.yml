name: Deploy to Staging

on:
  push:
    branches: [develop]

concurrency:
  group: deploy-staging
  cancel-in-progress: true

jobs:
  ci:
    name: CI Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run type-check

      - name: Unit tests
        run: npm run test
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://test.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: test-anon-key
          SUPABASE_SERVICE_ROLE_KEY: test-service-role-key

  migrate:
    name: Run Staging Migrations
    runs-on: ubuntu-latest
    needs: ci
    environment: staging
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # See deploy-production.yml: dated supabase/migrations/*.sql are the schema
      # source of truth (not the drizzle journal); drizzle `db:migrate` removed.
      # STAGING_DATABASE_URL must be the IPv4 pooler host (direct host is
      # IPv6-only and unreachable from the runner). NOTE: the `staging`
      # GitHub environment / STAGING_DATABASE_URL secret is not yet configured.
      - name: Apply incremental SQL migrations
        shell: bash
        run: npm run db:apply-sql supabase/migrations/2026-07-*.sql
        env:
          DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
# Deployment to Vercel is performed out-of-band via the Vercel CLI, not from
# this workflow. The previous amondnet/vercel-action deploy job required
# VERCEL_TOKEN / VERCEL_ORG_ID / VERCEL_PROJECT_ID secrets that are not
# provisioned, so it was removed. Re-add once scoped Vercel CI credentials and
# the `staging` environment / STAGING_DATABASE_URL secret are configured.
