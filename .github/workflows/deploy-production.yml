name: Deploy to Production

on:
  push:
    branches: [main]

concurrency:
  group: deploy-production
  # Do not cancel in-flight production deploys.
  cancel-in-progress: false

jobs:
  ci:
    name: CI Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run type-check

      - name: Unit tests
        run: npm run test
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://test.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: test-anon-key
          SUPABASE_SERVICE_ROLE_KEY: test-service-role-key

  migrate:
    name: Run Production Migrations
    runs-on: ubuntu-latest
    needs: ci
    # GitHub Environments gate: requires a designated reviewer to approve
    # before this job proceeds. Configure reviewers in:
    # Settings > Environments > production > Required reviewers
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # NOTE: the hand-written dated SQL files under supabase/migrations/ are the
      # source of truth for prod schema changes — NOT the drizzle journal (prod
      # was provisioned via db:push/export, so `drizzle-kit migrate` would try to
      # re-apply base migrations onto an already-provisioned schema and fail
      # "already exists"). The drizzle `db:migrate` step was therefore removed.
      # All SQL files are idempotent (ADD COLUMN/CREATE ... IF NOT EXISTS,
      # ADD VALUE IF NOT EXISTS), so re-running on an already-migrated DB is a
      # no-op. DATABASE_URL must be the IPv4 pooler host (the direct
      # db.<ref>.supabase.co host is IPv6-only and unreachable from the runner).
      - name: Apply incremental SQL migrations
        shell: bash
        run: npm run db:apply-sql supabase/migrations/2026-07-*.sql
        env:
          DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
# Deployment to Vercel production is performed out-of-band via the
# `vercel deploy --prod` CLI (the reliable path for this project), not from this
# workflow. The previous amondnet/vercel-action deploy job required
# VERCEL_TOKEN / VERCEL_ORG_ID / VERCEL_PROJECT_ID secrets that are not
# provisioned, so it failed every run and was removed to keep this pipeline
# (CI + production migrations) green. Re-add a deploy job here once dedicated
# scoped Vercel CI credentials are configured as environment secrets.
